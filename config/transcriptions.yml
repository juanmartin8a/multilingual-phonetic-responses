# Settings for populate-transcriptions.mjs only. CLI options override these values.
# Monetary values are quoted to preserve exact decimal amounts.
project: ~/development/react-native/sapo
# Maximum words per LLM call: 1-1000. Review calls share the same limits/model.
batchSize: 100
# Paths in YAML are relative to this file. The default state directory is
# <script-dir>/.state; only finalized results and the respelling pair are saved.
# stateDir: ../.state
# maxPages: 1  # Omit or set to 0 to scan all pages.

ai:
  # OpenAI calls use AI Gateway's provider-native endpoint and stored provider key.
  provider: openai
  model: gpt-6-luna
  api: responses
  reasoningEffort: medium
  maxOutputTokens: 25000
  # Standard, non-regional GPT-6.1 Sol prices, USD/million tokens (2026-10-08).
  # Change model and all four prices together; use your actual OpenAI rates.
  pricesUsdPerMillion:
    input: "2"
    cachedInput: "0.1"
    cacheWrite: "2.5"
    output: "10"

limits:
  maxUsd: "2"  # Per-run stop threshold; finish the active batch/reviews.
  requestsPerMinute: 10
  tokensPerMinute: 200000
  maxAttempts: 3
  timeoutMs: 300000

# Non-secret account identifiers required for generation.
cloudflare:
  accountId: 
  gatewayId: 

# Optional source-language dialect overrides for IPA generation.
languagePolicies: {}
# languagePolicies:
#   es:
#     dialect: neutral Latin American Spanish
